name: Build TasteMM desktop
on:
  workflow_dispatch:
    inputs:
      model_bundle_url:
        description: HTTPS download URL for TasteMM-model-bundle.tar.gz
        required: true
        type: string
      model_bundle_sha256:
        description: SHA256 of the model archive
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install CPU PyTorch
        if: runner.os != 'macOS'
        run: python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install macOS PyTorch
        if: runner.os == 'macOS'
        run: |
          python -c "import platform; assert platform.machine() == 'arm64', 'This workflow targets Apple Silicon; Intel needs different torch pins.'"
          python -m pip install torch==2.4.1
      - name: Install inference and build dependencies
        run: python -m pip install -r requirements.txt
      - name: Download verified model bundle
        env:
          TASTEMM_MODEL_URL: ${{ inputs.model_bundle_url }}
          TASTEMM_MODEL_SHA256: ${{ inputs.model_bundle_sha256 }}
        run: python fetch_bundle.py
      - name: Build native application
        run: python build.py
      - name: Stage Windows documentation and provenance
        if: runner.os == 'Windows'
        run: python stage_release.py
      - name: Validate frozen inference and create archive
        if: runner.os != 'Linux'
        run: python package_release.py --validate
      - name: Validate frozen Linux inference and structure rendering
        if: runner.os == 'Linux'
        run: xvfb-run -a python package_release.py --validate
      - uses: actions/upload-artifact@v6
        with:
          name: TasteMM-${{ runner.os }}-${{ runner.arch }}
          path: releases/*
          if-no-files-found: error
